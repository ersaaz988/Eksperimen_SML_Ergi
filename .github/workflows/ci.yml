name: CI/CD Pipeline MLProject

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas==2.1.4 scikit-learn==1.4.2

    - name: Execute MLProject
      run: |
        cd MLProject
        mlflow run . --env-manager=local

    - name: Read Run ID
      id: extract_id
      run: |
        cd MLProject
        RUN_ID=$(cat run_id.txt)
        echo "ID Model yang dihasilkan: $RUN_ID"
        echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

    - name: Build Docker Image (Bypass PIP Bug)
      run: |
        cd MLProject
        echo "[INFO] Menghasilkan Dockerfile dari MLflow..."
        mlflow models generate-dockerfile -m mlruns/0/${{ env.RUN_ID }}/artifacts/model -d docker_build_dir
        
        echo "[INFO] Menambal tautan get-pip.py yang rusak di dalam Dockerfile..."
        sed -i 's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' docker_build_dir/Dockerfile
        
        echo "[INFO] Membangun image Docker secara manual..."
        cd docker_build_dir
        docker build -t ersaaz988/model-sentimen:v1 .
        
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/model-sentimen:v1

    - name: Save Artifacts to GitHub (Syarat Skilled)
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-artifacts
        path: MLProject/mlruns/
